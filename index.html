<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cashflow Harian</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f5f4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cashflow">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f6f7f4;--card:#fff;--text:#1c2420;--mute:#6b766f;--line:#e3e7e2;--in:#1b8a5a;--out:#d1453b;--acc:#1f5f4a;--accT:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121715;--card:#1b221f;--text:#eaf0ec;--mute:#93a09a;--line:#2a332f;--in:#4cc790;--out:#ff7a70;--acc:#4cc790;--accT:#0d1512;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121715;--card:#1b221f;--text:#eaf0ec;--mute:#93a09a;--line:#2a332f;--in:#4cc790;--out:#ff7a70;--acc:#4cc790;--accT:#0d1512;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;margin:4px 0 2px}
.sub{color:var(--mute);font-size:.85rem;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.bal{text-align:center}
.bal small{color:var(--mute)}
.bal .big{font-size:2rem;font-weight:700;margin:2px 0}
.row{display:flex;gap:8px}
.row>*{flex:1}
.stat{background:var(--bg);border-radius:10px;padding:10px;text-align:center}
.stat small{display:block;color:var(--mute);font-size:.75rem}
.stat b{font-size:1.02rem}
.in{color:var(--in)}.out{color:var(--out)}
label{display:block;font-size:.78rem;color:var(--mute);margin:8px 0 3px}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font-size:1rem;font-family:inherit}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font-size:.95rem;cursor:pointer}
.seg button.on.m{background:var(--in);color:#fff;border-color:var(--in)}
.seg button.on.k{background:var(--out);color:#fff;border-color:var(--out)}
.go{width:100%;margin-top:12px;padding:12px;border:0;border-radius:10px;background:var(--acc);color:var(--accT);font-size:1rem;font-weight:600;cursor:pointer}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.head h2{font-size:1rem;margin:0}
.head input{width:auto}
.chart{display:flex;align-items:flex-end;gap:2px;height:80px;margin-top:6px}
.chart div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.chart i{display:block;width:100%;min-height:2px;border-radius:2px 2px 0 0}
.lbl{display:flex;justify-content:space-between;color:var(--mute);font-size:.7rem;margin-top:3px}
.day{font-size:.78rem;color:var(--mute);margin:12px 0 4px;display:flex;justify-content:space-between}
.item{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-size:.92rem;font-weight:600}
.item .t span{color:var(--mute);font-size:.78rem;overflow-wrap:anywhere}
.item .a{font-weight:600;white-space:nowrap}
.x{background:none;border:0;color:var(--mute);font-size:1.1rem;cursor:pointer;padding:4px 6px}
.empty{color:var(--mute);text-align:center;padding:18px 0;font-size:.9rem}
.note{color:var(--mute);font-size:.72rem;text-align:center;margin:10px 0 20px}
</style>
</head>
<body>
<main>
  <h1>💰 Cashflow Harian</h1>
  <div class="sub">Rekod wang masuk &amp; keluar anda, dalam Ringgit Malaysia (RM)</div>

  <div class="card bal">
    <small>Baki bulan ini</small>
    <div class="big" id="baki">RM 0.00</div>
    <div class="row" style="margin-top:10px">
      <div class="stat"><small>Masuk</small><b class="in" id="masuk">RM 0.00</b></div>
      <div class="stat"><small>Keluar</small><b class="out" id="keluar">RM 0.00</b></div>
    </div>
  </div>

  <div class="card">
    <div class="seg" id="seg">
      <button type="button" class="on m" data-j="masuk">＋ Wang Masuk</button>
      <button type="button" data-j="keluar">－ Wang Keluar</button>
    </div>
    <div class="row">
      <div><label for="jumlah">Jumlah (RM)</label><input id="jumlah" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0.00"></div>
      <div><label for="tarikh">Tarikh</label><input id="tarikh" type="date"></div>
    </div>
    <label for="kat">Kategori</label>
    <select id="kat"></select>
    <label for="nota">Catatan (pilihan)</label>
    <input id="nota" type="text" maxlength="80" placeholder="cth: Nasi lemak + teh ais">
    <button class="go" id="simpan" type="button">Simpan</button>
  </div>

  <div class="card">
    <div class="head"><h2>Rekod</h2><input type="month" id="bulan"></div>
    <div class="chart" id="chart"></div>
    <div class="lbl"><span>1</span><span id="lblEnd"></span></div>
    <div id="senarai"></div>
  </div>
  <div class="note" id="note"></div>
</main>

<script>
(function(){
  var KAT={masuk:["Gaji","Bisnes","Bonus","Hadiah","Lain-lain"],
           keluar:["Makanan","Pengangkutan","Bil & Utiliti","Sewa / Ansuran","Belanja Runcit","Hiburan","Kesihatan","Pendidikan","Lain-lain"]};
  var jenis="masuk", entries=[], store=null, uid=null;
  var $=function(i){return document.getElementById(i)};
  function rm(n){return "RM "+Number(n).toLocaleString("ms-MY",{minimumFractionDigits:2,maximumFractionDigits:2})}
  function ymd(d){var m=d.getMonth()+1,x=d.getDate();return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(x<10?"0":"")+x}
  var HARI=["Ahad","Isnin","Selasa","Rabu","Khamis","Jumaat","Sabtu"],BLN=["Jan","Feb","Mac","Apr","Mei","Jun","Jul","Ogos","Sep","Okt","Nov","Dis"];
  function fmtDay(s){var p=s.split("-"),d=new Date(+p[0],+p[1]-1,+p[2]);return HARI[d.getDay()]+", "+d.getDate()+" "+BLN[d.getMonth()]+" "+d.getFullYear()}

  function fillKat(){var s=$("kat");s.textContent="";KAT[jenis].forEach(function(k){var o=document.createElement("option");o.value=o.textContent=k;s.appendChild(o)})}
  $("seg").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;jenis=b.dataset.j;
    [].forEach.call($("seg").children,function(x){x.className=""});b.className="on "+(jenis==="masuk"?"m":"k");fillKat()});
  $("tarikh").value=ymd(new Date());$("bulan").value=ymd(new Date()).slice(0,7);fillKat();
  $("bulan").addEventListener("change",render);

  // ---- storan ----
  function lsLoad(){try{entries=JSON.parse(localStorage.getItem("cashflow_v1")||"[]")}catch(e){entries=[]}}
  function lsSave(){try{localStorage.setItem("cashflow_v1",JSON.stringify(entries))}catch(e){}}

  function init(){
    lsLoad();render();
    $("note").textContent="Data disimpan dalam pelayar ini sahaja.";
    if(!window.claude||!claude.use)return;
    var done=false,timer=setTimeout(function(){done=true},10000);
    Promise.all([claude.use("db"),claude.use("user")]).then(function(r){
      clearTimeout(timer);if(done||!r[0]||!r[1])return;
      return r[1].id().then(function(id){
        if(!id)return;uid=id;
        store=r[0].collection("data/users/"+id);
        var old=entries.slice();
        store.onSnapshot(function(snap){
          entries=snap.docs.map(function(d){var x=d.data();x.id=d.id;return x});
          // pindahkan data lama dari pelayar (sekali sahaja)
          if(old.length){var m=old;old=[];var have={};entries.forEach(function(e){have[e.id]=1});
            m.forEach(function(e){if(!have[e.id]){store.doc(e.id).set({tarikh:e.tarikh,jenis:e.jenis,kat:e.kat,jumlah:e.jumlah,nota:e.nota||"",ts:e.ts||Date.now()}).catch(function(){})}});
            try{localStorage.removeItem("cashflow_v1")}catch(e){}}
          render();
        },function(){});
        $("note").textContent="Data disimpan secara peribadi dalam akaun anda dan boleh dibuka dari mana-mana peranti.";
      });
    }).catch(function(){});
  }

  $("simpan").addEventListener("click",function(){
    var j=parseFloat($("jumlah").value);
    if(!(j>0)){$("jumlah").focus();return}
    var e={tarikh:$("tarikh").value||ymd(new Date()),jenis:jenis,kat:$("kat").value,jumlah:Math.round(j*100)/100,nota:$("nota").value.trim(),ts:Date.now()};
    var id="e"+e.ts.toString(36)+Math.random().toString(36).slice(2,6);
    if(store){store.doc(id).set(e).catch(function(){alert("Gagal menyimpan. Cuba lagi.")})}
    else{e.id=id;entries.push(e);lsSave();render()}
    $("jumlah").value="";$("nota").value="";$("tarikh").value=e.tarikh;
    var b=$("bulan");if(e.tarikh.slice(0,7)!==b.value){b.value=e.tarikh.slice(0,7);render()}
  });

  function del(id){
    if(!confirm("Padam rekod ini?"))return;
    if(store){store.doc(id).delete().catch(function(){})}
    else{entries=entries.filter(function(e){return e.id!==id});lsSave();render()}
  }

  function render(){
    var bln=$("bulan").value||ymd(new Date()).slice(0,7);
    var list=entries.filter(function(e){return e.tarikh&&e.tarikh.slice(0,7)===bln})
      .sort(function(a,b){return a.tarikh===b.tarikh?(b.ts||0)-(a.ts||0):(a.tarikh<b.tarikh?1:-1)});
    var m=0,k=0;list.forEach(function(e){if(e.jenis==="masuk")m+=e.jumlah;else k+=e.jumlah});
    $("masuk").textContent=rm(m);$("keluar").textContent=rm(k);
    var bk=$("baki");bk.textContent=(m-k<0?"-":"")+rm(Math.abs(m-k));bk.className="big "+(m-k<0?"out":"in");

    // carta harian
    var p=bln.split("-"),n=new Date(+p[0],+p[1],0).getDate(),dm=[],dk=[],mx=1,i;
    for(i=0;i<n;i++){dm.push(0);dk.push(0)}
    list.forEach(function(e){var d=+e.tarikh.slice(8,10)-1;if(d>=0&&d<n){if(e.jenis==="masuk")dm[d]+=e.jumlah;else dk[d]+=e.jumlah}});
    for(i=0;i<n;i++)mx=Math.max(mx,dm[i],dk[i]);
    var c=$("chart");c.textContent="";
    for(i=0;i<n;i++){var w=document.createElement("div"),a=document.createElement("i"),b=document.createElement("i");
      a.style.height=(dm[i]/mx*45)+"%";a.style.background="var(--in)";b.style.height=(dk[i]/mx*45)+"%";b.style.background="var(--out)";
      if(!dm[i])a.style.minHeight="0";if(!dk[i])b.style.minHeight="0";
      w.title=(i+1)+": +"+rm(dm[i])+" / -"+rm(dk[i]);w.appendChild(a);w.appendChild(b);c.appendChild(w)}
    $("lblEnd").textContent=n;

    // senarai
    var S=$("senarai");S.textContent="";
    if(!list.length){var em=document.createElement("div");em.className="empty";em.textContent="Belum ada rekod untuk bulan ini.";S.appendChild(em);return}
    var cur="";
    list.forEach(function(e){
      if(e.tarikh!==cur){cur=e.tarikh;var dd=document.createElement("div");dd.className="day";
        var net=0;list.forEach(function(x){if(x.tarikh===cur)net+=x.jenis==="masuk"?x.jumlah:-x.jumlah});
        var s1=document.createElement("span");s1.textContent=fmtDay(cur);var s2=document.createElement("span");
        s2.textContent=(net<0?"-":"")+rm(Math.abs(net));s2.className=net<0?"out":"in";dd.appendChild(s1);dd.appendChild(s2);S.appendChild(dd)}
      var it=document.createElement("div");it.className="item";
      var t=document.createElement("div");t.className="t";var b1=document.createElement("b");b1.textContent=e.kat||"-";
      var s=document.createElement("span");s.textContent=e.nota||"";t.appendChild(b1);if(e.nota)t.appendChild(s);
      var am=document.createElement("div");am.className="a "+(e.jenis==="masuk"?"in":"out");am.textContent=(e.jenis==="masuk"?"+":"-")+rm(e.jumlah);
      var x=document.createElement("button");x.className="x";x.type="button";x.setAttribute("aria-label","Padam");x.textContent="✕";
      x.addEventListener("click",function(){del(e.id)});
      it.appendChild(t);it.appendChild(am);it.appendChild(x);S.appendChild(it)});
  }
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
  }
  init();
})();
</script>
</body>
</html>
